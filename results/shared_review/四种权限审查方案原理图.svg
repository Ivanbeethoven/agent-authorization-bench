<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="151.28mm" viewBox="0 0 1200 992" role="img" aria-labelledby="flow-title flow-desc" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
<title id="flow-title">四种 Agent 权限审查方法原理图</title><desc id="flow-desc">从上到下比较直接判断、按转交概率分配审查、按历史收益分配审查，以及先初判再逐项核对。后两种方法分别展示历史校准和两次 Jev 调用。</desc>
<defs><marker id="flow-head" viewBox="0 0 10 10" markerWidth="5.5" markerHeight="5.5" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#47666a"/></marker></defs><rect width="1200" height="992" fill="#ffffff"/>
<text x="30" y="52" font-size="36" font-weight="700" fill="#18363a" text-anchor="start">四种 Agent 权限审查方法</text>
<text x="32" y="84" font-size="17" font-weight="400" fill="#18363a" text-anchor="start">共同输入为用户原话、适用政策、当前状态和候选动作。沿每行箭头阅读，最右侧是最终决定的来源。</text>
<rect x="19" y="111" width="1162" height="35" fill="#e9f1ed" rx="3"/>
<text x="32" y="135" font-size="16" font-weight="650" fill="#18363a" text-anchor="start">审查方案</text>
<text x="244" y="135" font-size="16" font-weight="650" fill="#18363a" text-anchor="start">权限判断与转交依据</text>
<text x="982" y="135" font-size="16" font-weight="650" fill="#18363a" text-anchor="start">最终决定</text>
<line x1="20" y1="260" x2="1180" y2="260" stroke="#c8d7d3" stroke-width="1.5"/>
<line x1="20" y1="425" x2="1180" y2="425" stroke="#c8d7d3" stroke-width="1.5"/>
<line x1="20" y1="690" x2="1180" y2="690" stroke="#c8d7d3" stroke-width="1.5"/>
<line x1="20" y1="906" x2="1180" y2="906" stroke="#c8d7d3" stroke-width="1.5"/>
<text x="30" y="171" font-size="17" font-weight="650" fill="#226d60" text-anchor="start">方法一</text>
<text x="30" y="203" font-size="22" font-weight="700" fill="#18363a" text-anchor="start">DeepSeek</text>
<text x="30" y="230" font-size="22" font-weight="700" fill="#18363a" text-anchor="start">直接判断</text>
<text x="30" y="256" font-size="15" font-weight="400" fill="#455e60" text-anchor="start">每条请求调用一次</text>
<g id="node-one-input"><rect x="244" y="170" width="170" height="65" rx="6" fill="#ffffff" stroke="#a3b4b4" stroke-width="1.4"/>
<text x="329" y="208.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">原始请求</text>
</g>
<g id="node-one-deepseek"><rect x="487" y="170" width="270" height="65" rx="6" fill="#f0f4f3" stroke="#a5b9b5" stroke-width="1.4"/>
<text x="622" y="197.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">DeepSeek Flash</text>
<text x="622" y="220.5" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">对照授权，选择任务原生类别</text>
</g>
<g id="node-one-out"><rect x="982" y="170" width="185" height="65" rx="6" fill="#ecf2f8" stroke="#99b0c6" stroke-width="1.4"/>
<text x="1074.5" y="208.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">采用 DeepSeek 决定</text>
</g>
<path d="M414 202 H482" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<path d="M757 202 H977" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<text x="30" y="292" font-size="17" font-weight="650" fill="#226d60" text-anchor="start">方法二</text>
<text x="30" y="324" font-size="22" font-weight="700" fill="#18363a" text-anchor="start">按 Jev 转交概率</text>
<text x="30" y="351" font-size="22" font-weight="700" fill="#18363a" text-anchor="start">选择审查者</text>
<text x="30" y="377" font-size="15" font-weight="400" fill="#455e60" text-anchor="start">先选择谁来审查</text>
<g id="node-two-jev"><rect x="244" y="306" width="230" height="78" rx="6" fill="#f2eded" stroke="#baaab2" stroke-width="1.4"/>
<text x="359" y="340" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">Jev 阅读原始请求</text>
<text x="359" y="363" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">估计需要高级审查的概率</text>
</g>
<g id="node-two-rank"><rect x="538" y="306" width="231" height="78" rx="6" fill="#f0f4f3" stroke="#a5b9b5" stroke-width="1.4"/>
<text x="653.5" y="340" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">按转交概率排序</text>
<text x="653.5" y="363" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">优先复核分数靠前的请求</text>
</g>
<path d="M474 345 H532" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<g id="branch-two">
<path d="M769 345 H814" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round"/>
<path d="M814 345 V311 H977" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<path d="M814 345 V379 H977" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<text x="844" y="304" font-size="15" font-weight="400" fill="#18363a" text-anchor="start">进入名额</text>
<text x="844" y="372" font-size="15" font-weight="400" fill="#18363a" text-anchor="start">其余请求</text>
</g>
<g id="node-two-gpt"><rect x="982" y="288" width="185" height="47" rx="6" fill="#ecf2f8" stroke="#99b0c6" stroke-width="1.4"/>
<text x="1074.5" y="317.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">GPT 独立裁决</text>
</g>
<g id="node-two-deep"><rect x="982" y="356" width="185" height="47" rx="6" fill="#ecf2f8" stroke="#99b0c6" stroke-width="1.4"/>
<text x="1074.5" y="385.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">DeepSeek 裁决</text>
</g>
<text x="30" y="463" font-size="17" font-weight="650" fill="#226d60" text-anchor="start">方法三</text>
<text x="30" y="495" font-size="22" font-weight="700" fill="#18363a" text-anchor="start">按历史纠错收益</text>
<text x="30" y="522" font-size="22" font-weight="700" fill="#18363a" text-anchor="start">选择审查者</text>
<text x="30" y="548" font-size="15" font-weight="400" fill="#455e60" text-anchor="start">先校准，再用于新题</text>
<g id="calibration-band"><rect x="230" y="440" width="664" height="105" rx="7" fill="#f1f7f3" stroke="#bdd6c9" stroke-width="1.4"/></g>
<text x="244" y="463" font-size="16" font-weight="650" fill="#226d60" text-anchor="start">历史校准  ·  仅用 236 条旧题的标签</text>
<g id="node-three-history"><rect x="244" y="474" width="311" height="58" rx="6" fill="#ffffff" stroke="#a3b4b4" stroke-width="1.4"/>
<text x="399.5" y="498" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">比较 DeepSeek 与 GPT 的损失</text>
<text x="399.5" y="521" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">一般错误计 1 分，误放行计 4 分</text>
</g>
<g id="node-three-table"><rect x="607" y="474" width="270" height="58" rx="6" fill="#e2f1eb" stroke="#398471" stroke-width="1.4"/>
<text x="742" y="498" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">固定各组的平均纠错收益</text>
<text x="742" y="521" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">分组损失差之和 ÷（组内题数 + 8）</text>
</g>
<path d="M555 503 H602" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<text x="244" y="575" font-size="16" font-weight="650" fill="#226d60" text-anchor="start">新请求  ·  应用已固定的收益表</text>
<g id="node-three-jev"><rect x="244" y="589" width="270" height="72" rx="6" fill="#f2eded" stroke="#baaab2" stroke-width="1.4"/>
<text x="379" y="620" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">Jev 判断当前请求的分组</text>
<text x="379" y="643" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">评测任务、主要因素、审查建议</text>
</g>
<g id="node-three-rank"><rect x="586" y="589" width="269" height="72" rx="6" fill="#e2f1eb" stroke="#398471" stroke-width="1.4"/>
<text x="720.5" y="620" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">按分组收益排序</text>
<text x="720.5" y="643" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">同收益时再比较转交概率</text>
</g>
<path d="M514 625 H581" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<path d="M742 532 V582" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)" stroke-dasharray="5 4"/>
<g id="branch-three">
<path d="M855 625 H878" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round"/>
<path d="M878 625 V586 H977" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<path d="M878 625 V655 H977" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<text x="897" y="579" font-size="15" font-weight="400" fill="#18363a" text-anchor="start">进入名额</text>
<text x="897" y="648" font-size="15" font-weight="400" fill="#18363a" text-anchor="start">其余请求</text>
</g>
<g id="node-three-gpt"><rect x="982" y="562" width="185" height="47" rx="6" fill="#ecf2f8" stroke="#99b0c6" stroke-width="1.4"/>
<text x="1074.5" y="591.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">GPT 独立裁决</text>
</g>
<g id="node-three-deep"><rect x="982" y="632" width="185" height="47" rx="6" fill="#ecf2f8" stroke="#99b0c6" stroke-width="1.4"/>
<text x="1074.5" y="661.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">DeepSeek 裁决</text>
</g>
<text x="30" y="729" font-size="17" font-weight="650" fill="#226d60" text-anchor="start">方法四</text>
<text x="30" y="761" font-size="22" font-weight="700" fill="#18363a" text-anchor="start">先初判</text>
<text x="30" y="788" font-size="22" font-weight="700" fill="#18363a" text-anchor="start">再逐项核对</text>
<text x="30" y="814" font-size="15" font-weight="400" fill="#455e60" text-anchor="start">每条请求调用两次 Jev</text>
<g id="node-four-deep"><rect x="244" y="754" width="153" height="81" rx="6" fill="#f0f4f3" stroke="#a5b9b5" stroke-width="1.4"/>
<text x="320.5" y="789.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">DeepSeek 初判</text>
<text x="320.5" y="812.5" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">保留初步决定</text>
</g>
<g id="node-four-audit"><rect x="425" y="737" width="205" height="114" rx="6" fill="#f2eded" stroke="#baaab2" stroke-width="1.4"/>
<text x="527.5" y="767" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">Jev 第一次核对</text>
<text x="527.5" y="790" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">动作与对象、接收范围</text>
<text x="527.5" y="811" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">数量与后果、授权条件</text>
<text x="527.5" y="832" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">选取相关原文片段</text>
</g>
<g id="node-four-route"><rect x="663" y="754" width="204" height="81" rx="6" fill="#f2eded" stroke="#baaab2" stroke-width="1.4"/>
<text x="765" y="789.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">Jev 第二次判断</text>
<text x="765" y="812.5" font-size="15" font-weight="400" fill="#18363a" text-anchor="middle">估计 GPT 纠错机会</text>
</g>
<path d="M397 794 H419" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<path d="M630 794 H657" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<g id="branch-four">
<path d="M867 794 H885" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round"/>
<path d="M885 794 V749 H977" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<path d="M885 794 V836 H977" fill="none" stroke="#47666a" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow-head)"/>
<text x="899" y="742" font-size="15" font-weight="400" fill="#18363a" text-anchor="start">进入名额</text>
<text x="899" y="829" font-size="15" font-weight="400" fill="#18363a" text-anchor="start">其余请求</text>
</g>
<g id="node-four-gpt"><rect x="982" y="725" width="185" height="47" rx="6" fill="#ecf2f8" stroke="#99b0c6" stroke-width="1.4"/>
<text x="1074.5" y="754.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">GPT 独立裁决</text>
</g>
<g id="node-four-original"><rect x="982" y="812" width="185" height="47" rx="6" fill="#ecf2f8" stroke="#99b0c6" stroke-width="1.4"/>
<text x="1074.5" y="841.5" font-size="18" font-weight="650" fill="#18363a" text-anchor="middle">沿用 DeepSeek 初判</text>
</g>
<text x="426" y="880" font-size="15" font-weight="400" fill="#455e60" text-anchor="start">两次 Jev 调用均可读取原始材料。按第二次输出的转交概率分配名额。</text>
<text x="30" y="938" font-size="16" font-weight="700" fill="#18363a" text-anchor="start">复核预算</text>
<text x="130" y="938" font-size="16" font-weight="400" fill="#18363a" text-anchor="start">方法二至四每项评测各有 50 条请求、10 个 GPT 名额。GPT 独立阅读原始请求，作出权限决定。</text>
<text x="30" y="967" font-size="16" font-weight="700" fill="#18363a" text-anchor="start">测试评分</text>
<text x="130" y="967" font-size="16" font-weight="400" fill="#18363a" text-anchor="start">本轮 150 条新题的参考答案只用于评分。虚线表示调用已固定的历史收益表。</text>
</svg>
